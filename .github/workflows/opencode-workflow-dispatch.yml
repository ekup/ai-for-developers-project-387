name: Manual OpenCode Task
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Task for OpenCode"
        required: true
        type: string
      model:
        description: "Model to use"
        required: false
        default: "opencode-go/deepseek-v4.1-flash"
        type: string
jobs:
  opencode:
    # Запуск доступен только пользователям с правом записи в репозиторий; от
    # ботов и от форков страхуемся явно (см. README).
    if: |
      github.repository == 'ekup/ai-for-developers-project-387' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    # Страховка от зависания: если агент встанет на запросе разрешения,
    # которого в Actions никто не подтвердит, джоба упадёт по таймауту,
    # а не будет ждать дефолтные 6 часов (см. AGENTS.md).
    timeout-minutes: 15
    # Произвольная задача может дойти до коммита, PR и issue, поэтому write
    # нужен во всех трёх областях. OIDC не нужен: работаем через GITHUB_TOKEN.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Агент работает с issues через gh CLI (docs/agents/issue-tracker.md),
          # а без токена gh уходит искать креды в $HOME и встаёт на запросе
          # доступа к внешнему каталогу.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ inputs.model }}
          use_github_token: true
          # Публичный репозиторий: не расшариваем сессию агента (см. README).
          share: false
          prompt: ${{ inputs.prompt }}
