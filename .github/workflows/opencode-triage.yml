name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    # Пропускаем issues от ботов и от самого приложения OpenCode, чтобы агент
    # не отвечал на собственные служебные события.
    if: |
      !endsWith(github.actor, '[bot]') &&
      github.event.issue.user.type != 'Bot' &&
      !endsWith(github.event.issue.user.login, '[bot]')
    runs-on: ubuntu-latest
    # Страховка от зависания на запросе разрешения, которого в Actions никто
    # не подтвердит (см. AGENTS.md): падаем по таймауту, а не ждём 6 часов.
    timeout-minutes: 15
    # Триаж только комментирует issue, а комментарий создаёт токен приложения
    # OpenCode (обмен OIDC), поэтому на запись воркфлоу ничего не просит —
    # read нужен лишь для checkout.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check account age
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const user = await github.rest.users.getByUsername({
              username: context.payload.issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            return days >= 30;
          result-encoding: string

      - uses: actions/checkout@v6
        if: steps.check.outputs.result == 'true'
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        if: steps.check.outputs.result == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          # Публичный репозиторий: не расшариваем сессию агента (см. README).
          share: false
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.