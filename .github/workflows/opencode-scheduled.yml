name: Scheduled OpenCode Task

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  # Ручной запуск того же обзора по кнопке: без входных параметров, промпт
  # ниже фиксированный. Произвольные задачи — в opencode-workflow-dispatch.yml.
  workflow_dispatch:

jobs:
  opencode:
    # У schedule нет пользователя-инициатора, поэтому страхуемся от запуска в
    # форке и от бот-аккаунтов (см. README). Ручной запуск и так доступен
    # только пользователям с правом записи, а проверка репозитория отсекает
    # запуск из форка.
    if: |
      github.repository == 'ekup/ai-for-developers-project-387' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    # Страховка от зависания: если агент встанет на запросе разрешения,
    # которого в Actions никто не подтвердит, джоба упадёт по таймауту,
    # а не будет ждать дефолтные 6 часов (см. AGENTS.md).
    timeout-minutes: 15
    # Требование учебного задания: ручной запуск, поэтому write во всех трёх
    # областях и id-token: write. Текущий промпт заводит только issue, работа
    # идёт через GITHUB_TOKEN (use_github_token: true).
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Агент создаёт и читает issues через gh CLI (docs/agents/issue-tracker.md),
          # а без токена gh уходит искать креды в $HOME и встаёт на запросе
          # доступа к внешнему каталогу.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          use_github_token: true
          # Публичный репозиторий: не расшариваем сессию агента (см. README).
          share: false
          prompt: |
            Scan the codebase for TODO, FIXME, and HACK comments.
            Group findings by file and severity.
            Create a single issue with a structured summary.
            If similar issues already exist, reference them.