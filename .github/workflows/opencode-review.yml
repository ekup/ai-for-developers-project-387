name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Реагируем на код человека: PR от ботов и от самого приложения OpenCode
    # пропускаем, чтобы ревью не запускалось на собственные изменения агента.
    if: |
      !endsWith(github.actor, '[bot]') &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    # Страховка от зависания на запросе разрешения, которого в Actions никто
    # не подтвердит (см. AGENTS.md): падаем по таймауту, а не ждём 6 часов.
    timeout-minutes: 15
    # use_github_token: true — обмен OIDC не нужен. Комментарии и реакции в
    # разговоре PR проверяются по праву pull-requests, а не issues, поэтому без
    # write здесь экшен падает с 403 «Resource not accessible by integration».
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          use_github_token: true
          # Публичный репозиторий: не расшариваем сессию агента (см. README).
          share: false
          prompt: |
            Review this pull request:
            - Check for code quality issues
            - Look for potential bugs
            - Suggest improvements